# /etc/nginx/sites-available/kenyan-legal-beacon
# Copy this file to the server, symlink it into /etc/nginx/sites-enabled,
# replace `your-domain.com`, then run:  nginx -t && systemctl reload nginx

# Uncomment once certbot has issued a certificate to force HTTPS:
# server {
#     listen 80;
#     server_name your-domain.com www.your-domain.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    listen [::]:80;
    server_name mwauramurokiadvocates.co.ke www.mwauramurokiadvocates.co.ke;

    root /var/www/kenyan-legal-beacon;   # unzipped dist/ from the frontend build
    index index.html;

    # SEO: serve pre-rendered route HTML directly, never fall back to root for bots
    # (files are generated by scripts/seo-prerender.mjs).

    # Comfortably above the API's 10 MB upload cap.
    client_max_body_size 12m;

    # Static SPA files + history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API calls to the local Node service. Port 4000 must never be
    # reachable directly from outside (firewall: only 80/443/SSH open).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Long-lived caching for hashed static assets.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}